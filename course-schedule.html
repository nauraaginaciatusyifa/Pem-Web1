<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jadwal Kuliah</title>

    <style>
        body {
            background-color: white;
            font-family: "Times New Roman", serif;
            margin: 8px;
        }

        .container {
            border: 3px double gray;
            padding: 8px;
        }

        h1 {
            font-size: 36px;
        }

        table {
            width: 100%;
            border: 3px double gray;
            border-spacing: 3px;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid gray;
            padding: 6px;
            font-size: 22px;
        }

        th {
            background-color: pink;
            text-align: center;
        }

        td {
            background-color: white;
        }

        caption {
            font-size: 28px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Jadwal Kuliah</h1>

        <table>
            <caption>Jadwal Kuliah Semester 1</caption>

            <tr>
                <th>Hari</th>
                <th>Jam</th>
                <th>Mata Kuliah</th>
                <th>Ruangan</th>
            </tr>

            <tr>
                <td>Senin</td>
                <td>10:00 - 11:40</td>
                <td>Pemrograman Web</td>
                <td>2F</td>
            </tr>

            <tr>
                <td>Selasa</td>
                <td>13:00 - 15:30</td>
                <td>Basis Data</td>
                <td>2F</td>
            </tr>

            <tr>
                <td>Kamis</td>
                <td>14:20 - 16:00</td>
                <td>Sistem Operasi</td>
                <td>2F</td>
            </tr>

            <tr>
                <td>Jumat</td>
                <td>08:00 - 09:40</td>
                <td>Algoritma</td>
                <td>2F</td>
            </tr>

            <tr>
                <td colspan="3">Kegiatan Mahasiswa</td>
                <td>Aula</td>
            </tr>

        </table>

    </div>

</body>
</html>
