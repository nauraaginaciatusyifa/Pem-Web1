<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat Pendidikan</title>

    <style>
        body {
            background-color: #fff0f5;
            font-family: "Times New Roman", serif;
            margin: 8px;
            color: #66334d;
        }

        .container {
            border: 3px double #f28bb5;
            padding: 8px;
            background-color: white;
            border-radius: 8px;
        }

        h1 {
            font-size: 36px;
            color: #d63384;
        }

        table {
            width: 100%;
            border: 3px double #f28bb5;
            border-spacing: 3px;
            box-sizing: border-box;
        }

        th, td {
            border: 1px solid #f28bb5;
            padding: 6px;
            font-size: 22px;
        }

        th {
            background-color: #ffcce0;
            color: #66334d;
            text-align: center;
        }

        td {
            background-color: #fff7fa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Riwayat Pendidikan</h1>

        <table>
            <tr>
                <th>No</th>
                <th>Jenjang</th>
                <th>Nama Sekolah</th>
                <th>Tahun</th>
            </tr>

            <tr>
                <td>1</td>
                <td>SD</td>
                <td>SD Negeri Tanggulun</td>
                <td>2014 - 2020</td>
            </tr>

            <tr>
                <td>2</td>
                <td>SMP</td>
                <td>SMP 4 Kalijati</td>
                <td>2020 - 2023</td>
            </tr>

            <tr>
                <td>3</td>
                <td>SMA</td>
                <td>SMA Negeri 1 Kalijati</td>
                <td>2023 - 2026</td>
            </tr>

            <tr>
                <td>4</td>
                <td>S1</td>
                <td>Universitas Mandiri</td>
                <td>2026 - Sekarang</td>
            </tr>
        </table>

    </div>

</body>
</html>
