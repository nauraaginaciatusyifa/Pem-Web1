    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to bottom, #fff4f8, #fde6ef);
            color: #66334d;
            font-family: Arial, sans-serif;
        }

        .welcome {
            font-weight: bold;
        }

        .welcome a {
            color: #d63384;
            text-decoration: none;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 3px #d63384;
        }

        h1 {
            margin: 25px 0;
            text-align: center;
            color: #d63384;
            font-size: clamp(24px, 5vw, 36px);
        }

        ul {
            list-style: none;
            padding: 10px;
            margin: 0;
            width: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        li {
            flex: 0 1 auto;
        }

        li a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 18px;
            background-color: white;
            border: 1px solid #f4c2d6;
            border-left: 5px solid #d63384;
            border-radius: 10px;
            color: #66334d;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 3px 8px #d6338415;
            transition: transform 0.3s ease,
                        background-color 0.3s ease;
        }

        li a::after {
            content: "›";
            color: #d63384;
            font-size: 25px;
        }

        li a:hover {
            background-color: #ffcce0;
            transform: translateY(-4px);
        }
    </style>
</head>
