<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Tugas</title>
  <style>
    :root {
      --bg: #fde6ef;
      --bg-soft: #fff4f8;
      --panel: #ffffff;
      --border: #f4c2d6;
      --text: #3d1a2b;
      --muted: #9a5a77;
      --accent: #d6336c;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 56px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(ellipse at top, var(--bg-soft) 0%, var(--bg) 65%);
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      line-height: 1.6;
    }

    body > p {
      margin: 0 0 20px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    body > p a {
      color: var(--muted);
      text-decoration: none;
    }

    body > p a:hover { color: var(--accent); }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      width: 200px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px var(--accent), 0 18px 36px rgba(214, 51, 108, 0.25);
    }

    h1 {
      margin: 32px 0 28px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: var(--text);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li a {
      display: block;
      padding: 14px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(214, 51, 108, 0.08);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    li a:hover {
      background: #fff0f6;
      transform: translateX(4px);
      box-shadow: 0 6px 16px rgba(214, 51, 108, 0.18);
    }

    li a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      li a { transition: none; }
      li a:hover { transform: none; }
    }
  </style>
</head>
