<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Final Tugas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to bottom, #fff4f8, #fde6ef);
            color: #66334d;
            font-family: Arial, sans-serif;
        }

        .welcome {
            font-weight: bold;
        }

        .welcome a {
            color: #d63384;
            text-decoration: none;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 3px #d63384;
        }

        h1 {
            margin: 25px 0;
            text-align: center;
            color: #d63384;
            font-size: clamp(24px, 5vw, 36px);
        }

        .menu {
            width: 100%;
            max-width: 460px;
        }

        .menu-button {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px #d6338425;
        }

        .menu-button:hover {
            background-color: #bd2872;
        }

        .arrow {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .menu-button.open .arrow {
            transform: rotate(180deg);
        }

        .menu-list {
            display: none;
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
            gap: 10px;
        }

        .menu-list.show {
            display: flex;
            flex-direction: column;
        }

        .menu-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background-color: white;
            border: 1px solid #f4c2d6;
            border-left: 5px solid #d63384;
            border-radius: 10px;
            color: #66334d;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .menu-list a::after {
            content: "›";
            color: #d63384;
            font-size: 24px;
        }

        .menu-list a:hover {
            background-color: #ffcce0;
            transform: translateX(5px);
        }
    </style>
</head>

<body>

    <p class="welcome">
        <a href="about.me.html">HALO SEMUANYA!</a>
    </p>

    <img src="IMG_248.jpg" alt="Foto saya">

    <h1>Selamat Datang di Web Saya</h1>

    <div class="menu">

        <button class="menu-button" id="menuButton"
                onclick="toggleMenu()"
                aria-expanded="false"
                aria-controls="menuList">
            <span>MENU TUGAS</span>
            <span class="arrow">⌄</span>
        </button>

        <ul class="menu-list" id="menuList">
            <li><a href="profile.html">MY PROFILE</a></li>
            <li><a href="about.me.html">ABOUT ME</a></li>
            <li><a href="hobbies.html">MY HOBBIES</a></li>
            <li><a href="educations.html">EDUCATION</a></li>
            <li><a href="course-schedule.html">CLASS SCHEDULE</a></li>
            <li><a href="form.html">FORM</a></li>
            <li><a href="table%201.html">TABLE 1</a></li>
            <li><a href="table%202.html">TABLE 2</a></li>
            <li><a href="table%203.html">TABLE 3</a></li>
        </ul>

    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("menuList");
            const button = document.getElementById("menuButton");

            menu.classList.toggle("show");
            button.classList.toggle("open");

            button.setAttribute(
                "aria-expanded",
                menu.classList.contains("show")
            );
        }
    </script>

</body>
</html>
