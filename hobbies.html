<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hobbies</title>

    <style>
        body {
            background-color: #fff0f5;
            font-family: Arial, sans-serif;
            color: #66334d;
            margin: 30px;
        }

        div {
            border: 2px solid #f28bb5;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
        }

        h1 {
            color: #d63384;
            background-color: #ffcce0;
            padding: 12px;
            border-radius: 8px;
        }

        h2 {
            color: #d63384;
            border-bottom: 2px solid #f28bb5;
            padding-bottom: 8px;
        }

        p {
            font-size: 16px;
        }

        ul, ol {
            background-color: #fff0f5;
            padding: 15px 15px 15px 40px;
            border-radius: 8px;
        }

        li {
            padding: 4px;
        }

        li::marker {
            color: #e75480;
        }
    </style>
</head>
<body>

<div>

    <h1>Hobi</h1>

    <p>Beberapa hobi saya adalah:</p>

    <ul>
        <li>Membaca novel</li>
        <li>Menonton horor</li>
        <li>Mendengarkan musik</li>
        <li>Traveling</li>
    </ul>

    <h2>Urutan Hobi Favorit</h2>

    <ol type="A">
        <li>Traveling</li>
        <li>Mendengarkan musik</li>
        <li>Menonton horor</li>
        <li>Membaca novel</li>
    </ol>

</div>

</body>
</html>
